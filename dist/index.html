<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오늘 뭐 먹지? | 점심 룰렛</title><style>
:root{--ink:#253048;--orange:#ff5a36;--cream:#fff9ed;--yellow:#ffc94d}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,'Malgun Gothic',sans-serif}.wrap{width:min(980px,calc(100% - 32px));margin:auto;padding:48px 0 64px}.hero{text-align:center}.tag{font-weight:800;letter-spacing:.15em;font-size:.75rem;color:var(--orange)}h1{font-size:clamp(2.7rem,8vw,5rem);margin:8px 0}.lead{color:#667085}.card{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:30px;padding:clamp(24px,5vw,52px);margin-top:30px;box-shadow:8px 8px 0 var(--ink)}h2{font-size:clamp(1.8rem,4vw,3rem);margin:8px 0 20px}.wheel{width:min(100%,380px);aspect-ratio:1;border:8px solid var(--ink);border-radius:50%;display:grid;place-items:center;background:conic-gradient(#ff8a5c 0 60deg,#ffd166 60deg 120deg,#ef6f6c 120deg 180deg,#8fd3c1 180deg 240deg,#bb9ee8 240deg 300deg,#8fc3e9 300deg);box-shadow:0 8px 0 #d9dfe8;transition:transform 3s cubic-bezier(.12,.7,.2,1)}.wheel>div{width:42%;aspect-ratio:1;border:4px solid var(--ink);border-radius:50%;display:grid;place-items:center;text-align:center;background:white;font-weight:900}.menus{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.menus span{background:#fff0d8;padding:7px 10px;border-radius:20px;font-size:.9rem}button{font:inherit;font-weight:800;border:2px solid var(--ink);border-radius:14px;padding:14px 20px;background:var(--orange);color:white;box-shadow:4px 4px 0 var(--ink);cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}.result{display:none;margin-top:18px;padding:16px;border-radius:16px;background:#fff0d8}.result.show{display:block}.vote{margin-top:10px;background:#253048}.rank{margin-top:40px;background:var(--ink);color:#fff;border-radius:24px;padding:28px}.rank h2{font-size:2rem}.rank ol{display:grid;gap:10px;margin:0;padding-left:28px}.rank li{display:flex;justify-content:space-between;border-bottom:1px solid #526078;padding:8px 0}.note{font-size:.82rem;color:#667085}@media(max-width:700px){.wrap{padding-top:28px}.card{grid-template-columns:1fr;text-align:center}.wheel{order:-1;margin:auto}.menus{justify-content:center}}
</style></head><body><main class="wrap"><header class="hero"><p class="tag">LUNCH DECIDER</p><h1>오늘 뭐 먹지? 🍽️</h1><p class="lead">고민은 룰렛에게 맡기고, 맛있는 점심을 고르세요.</p></header><section class="card"><div><p class="tag">오늘의 점심 후보</p><h2>한 번 돌리면<br><span style="color:#ff5a36">메뉴가 딱!</span></h2><div class="menus" id="chips"></div><button id="spin">룰렛 돌리기 ✦</button><p class="note" id="hint">버튼을 누르면 오늘의 메뉴가 결정돼요.</p><div class="result" id="result"><strong id="pick"></strong><br><button class="vote" id="vote">이 메뉴 좋아요 ♥</button></div></div><div class="wheel" id="wheel"><div id="center">LUNCH<br>GO!</div></div></section><section class="rank"><p class="tag" style="color:#ffc94d">우리의 취향</p><h2>인기 메뉴 TOP 5</h2><ol id="ranking"></ol></section></main><script>
const menus=[['제육볶음','🍛'],['쌀국수','🍜'],['김치찌개','🍲'],['초밥','🍣'],['마라탕','🌶️'],['돈까스','🍱']];let picked=null,turn=0;const votes=JSON.parse(localStorage.getItem('lunchVotes')||'{}');menus.forEach((m,i)=>{if(votes[m[0]]==null)votes[m[0]]=[7,5,4,3,2,1][i];chips.innerHTML+=`<span>${m[1]} ${m[0]}</span>`});function rank(){localStorage.setItem('lunchVotes',JSON.stringify(votes));ranking.innerHTML=[...menus].sort((a,b)=>votes[b[0]]-votes[a[0]]).slice(0,5).map((m,i)=>`<li><span>${i+1}. ${m[1]} ${m[0]}</span><b>${votes[m[0]]}표</b></li>`).join('')}async function cloud(){try{const r=await fetch('/api/votes');if(!r.ok)throw 0;const d=await r.json();menus.forEach(m=>votes[m[0]]=d[m[0]]||0);rank()}catch{rank()}}spin.onclick=()=>{if(spin.disabled)return;const i=Math.floor(Math.random()*menus.length);turn+=1800+Math.random()*720;wheel.style.transform=`rotate(${turn}deg)`;spin.disabled=true;setTimeout(()=>{picked=menus[i];center.innerHTML=`${picked[1]}<br>${picked[0]}`;pick.textContent=`오늘의 점심은 ${picked[0]}!`;result.classList.add('show');spin.disabled=false},3000)};vote.onclick=async()=>{if(!picked)return;vote.disabled=true;try{const r=await fetch('/api/votes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({menu:picked[0]})});if(!r.ok)throw 0;const d=await r.json();menus.forEach(m=>votes[m[0]]=d[m[0]]||0)}catch{votes[picked[0]]++}rank();vote.textContent='투표 완료! ✓'};async function status(){try{const r=await fetch('/api/status');const d=await r.json();if(!d.active){spin.disabled=true;spin.textContent='서비스가 종료되었습니다';hint.textContent='이 서비스는 1시간 운영 후 종료됩니다.'}}catch{}}cloud();status();
</script></body></html>
